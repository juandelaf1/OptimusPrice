## Historical Aggregate Features

```yaml
historical_aggregates:
  rolling_occupancy_7d:
    description: "7-day rolling occupancy rate"
    formula: "mean(booking_status_Not_Canceled) over 7-day window"
    type: float
    range: [0, 1]
    source: derived
    priority: HIGH
    complexity: MEDIUM
    requires_temporal: true

  rolling_occupancy_30d:
    description: "30-day rolling occupancy rate"
    formula: "mean(booking_status_Not_Canceled) over 30-day window"
    type: float
    range: [0, 1]
    source: derived
    priority: HIGH
    complexity: MEDIUM
    requires_temporal: true

  rolling_adr_7d:
    description: "7-day rolling average daily rate"
    formula: "mean(avg_price_per_room) over 7-day window"
    type: float
    range: [0, 510]
    source: derived
    priority: HIGH
    complexity: MEDIUM
    requires_temporal: true
    leakage_risk: Target-related

  rolling_adr_30d:
    description: "30-day rolling average daily rate"
    formula: "mean(avg_price_per_room) over 30-day window"
    type: float
    range: [0, 510]
    source: derived
    priority: HIGH
    complexity: MEDIUM
    requires_temporal: true
    leakage_risk: Target-related

  rolling_booking_pace_7d:
