# Candidate Features

**Generated**: June 2026
**Status**: Design phase

---

## Temporal Features

```yaml
temporal:
  season:
    description: "Season derived from month"
    formula: "month_to_season(arrival_month)"
    type: categorical
    values: [0, 1, 2, 3]
    source: derived
    priority: HIGH
    complexity: LOW

  quarter:
    description: "Quarter of year"
    formula: "(arrival_month - 1) // 3 + 1"
    type: int
    values: [1, 2, 3, 4]
    source: derived
    priority: HIGH
    complexity: LOW

  month_sin:
    description: "Cyclical month encoding (sine)"
    formula: "sin(2 * pi * arrival_month / 12)"
    type: float
    range: [-1, 1]
    source: derived
    priority: HIGH
    complexity: LOW

  month_cos:
    description: "Cyclical month encoding (cosine)"
    formula: "cos(2 * pi * arrival_month / 12)"
    type: float
    range: [-1, 1]
    source: derived
    priority: HIGH
    complexity: LOW

  day_sin:
    description: "Cyclical day encoding (sine)"
    formula: "sin(2 * pi * arrival_day_of_week / 7)"
    type: float
    range: [-1, 1]
    source: derived
    priority: MEDIUM
    complexity: LOW

  day_cos:
    description: "Cyclical day encoding (cosine)"
    formula: "cos(2 * pi * arrival_day_of_week / 7)"
    type: float
    range: [-1, 1]
    source: derived
    priority: MEDIUM
    complexity: LOW

  is_weekend:
    description: "Whether arrival is on weekend"
    formula: "1 if arrival_day_of_week in [5, 6] else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: HIGH
    complexity: LOW

  is_month_start:
    description: "Whether arrival is in first week of month"
    formula: "1 if arrival_date <= 7 else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: LOW
    complexity: LOW

  is_month_end:
    description: "Whether arrival is in last week of month"
    formula: "1 if arrival_date >= 25 else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: LOW
    complexity: LOW
```

## Booking Behavior Features

```yaml
booking_behavior:
  lead_time_bin:
    description: "Lead time categorized into bins"
    formula: "pd.cut(lead_time, bins=[0, 7, 30, 90, 180, 737])"
    type: categorical
    values: [0, 1, 2, 3, 4]
    source: derived
    priority: HIGH
    complexity: LOW

  advance_booking:
    description: "Whether booking was made more than 30 days in advance"
    formula: "1 if lead_time > 30 else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: HIGH
    complexity: LOW

  stay_length_category:
    description: "Stay length categorized"
    formula: "pd.cut(total_nights, bins=[0, 1, 3, 7, 14, 39])"
    type: categorical
    values: [0, 1, 2, 3, 4]
    source: derived
    priority: MEDIUM
    complexity: LOW

  is_short_stay:
    description: "Whether stay is 1 night or less"
    formula: "1 if total_nights <= 1 else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: MEDIUM
    complexity: LOW

  is_long_stay:
    description: "Whether stay is 7 nights or more"
    formula: "1 if total_nights >= 7 else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: MEDIUM
    complexity: LOW

  has_children:
    description: "Whether booking includes children"
    formula: "1 if children > 0 else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: HIGH
    complexity: LOW

  has_babies:
    description: "Whether booking includes babies"
    formula: "1 if babies > 0 else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: LOW
    complexity: LOW

  cancellation_history:
    description: "Whether guest has cancelled before"
    formula: "1 if previous_cancellations > 0 else 0"
    type: binary
    values: [0, 1]
    source: derived
    priority: MEDIUM
    complexity: LOW

  loyalty_score:
    description: "Simple loyalty score"
    formula: "is_repeated_guest + (previous_bookings_not_canceled > 0)"
    type: int
    values: [0, 1, 2]
    source: derived
    priority: MEDIUM
    complexity: LOW
```

## Demand Indicator Features

```yaml
demand_indicators:
  weekend_ratio:
    description: "Proportion of stay that is weekend nights"
    formula: "stays_in_weekend_nights / (total_nights + 1)"
    type: float
    range: [0, 1]
    source: derived
    priority: HIGH
    complexity: LOW

  guest_density:
    description: "Guests per night"
    formula: "total_guests / (total_nights + 1)"
    type: float
    range: [0, 7]
    source: derived
    priority: MEDIUM
    complexity: LOW

  booking_intensity:
    description: "Booking changes per day of lead time"
    formula: "booking_changes / (lead_time + 1)"
    type: float
    range: [0, 18]
    source: derived
    priority: LOW
    complexity: LOW

  special_request_rate:
    description: "Special requests per night"
    formula: "total_of_special_requests / (total_nights + 1)"
    type: float
    range: [0, 5]
    source: derived
    priority: MEDIUM
    complexity: LOW

  parking_rate:
    description: "Parking spaces per guest"
    formula: "required_car_parking_spaces / (total_guests + 1)"
    type: float
    range: [0, 4]
    source: derived
    priority: LOW
    complexity: LOW

  wait_ratio:
    description: "Waiting list days per lead time day"
    formula: "days_in_waiting_list / (lead_time + 1)"
    type: float
    range: [0, 126]
    source: derived
    priority: LOW
    complexity: LOW

  cancellation_ratio:
    description: "Cancellation rate"
    formula: "previous_cancellations / (previous_bookings_not_canceled + 1)"
    type: float
    range: [0, 15]
    source: derived
    priority: MEDIUM
    complexity: LOW
```

