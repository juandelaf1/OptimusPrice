# Dataset Registry

**Last Updated**: June 2026
**Source of Truth**: This file

---

## Primary Dataset

```yaml
primary:
  name: hotel_reservations_real.csv
  path: data/processed/hotel_reservations_real.csv
  source: Kaggle "Hotel Booking Demand"
  source_url: https://www.kaggle.com/datasets/jessemostak/hotel-booking-demand
  rows: 117429
  columns: 28
  encoding: label-encoded
  target: avg_price_per_room
  target_mean: 103.49
  target_std: 46.71
  features:
    - lead_time
    - arrival_year
    - arrival_month
    - arrival_date
    - arrival_week_number
    - arrival_day_of_week
    - stays_in_weekend_nights
    - stays_in_week_nights
    - total_guests
    - total_nights
    - adults
    - children
    - babies
    - is_repeated_guest
    - previous_cancellations
    - previous_bookings_not_canceled
    - booking_changes
    - days_in_waiting_list
    - required_car_parking_spaces
    - total_of_special_requests
    - room_type_value
    - meal_plan_value
    - market_segment_value
    - distribution_channel_value
    - customer_type_value
    - deposit_type_value
    - booking_status_Not_Canceled
  status: active
  usage: model training, validation, benchmarks
```

## Legacy Datasets

```yaml
legacy:
  hotel_reservations_clean.csv:
    path: data/processed/hotel_reservations_clean.csv
    rows: 34546
    columns: 27
    encoding: one-hot
    status: legacy
    reason: Smaller, one-hot encoded, tree models perform better on it
    usage: historical reference only

  hotel_reservations_enriched.csv:
    path: data/processed/hotel_reservations_enriched.csv
    rows: 34546
    columns: 42
    encoding: one-hot
    status: experimental
    reason: Enriched features, same row count as clean

  hotel_reservations_fe.csv:
    path: data/processed/hotel_reservations_fe.csv
    rows: 34579
    columns: 29
    status: experimental
    reason: Feature-engineered version
```

