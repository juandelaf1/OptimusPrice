## Feature Lineage

```yaml
lineage:
  total_guests:
    parents: [adults, children, babies]
    formula: "adults + children + babies"

  total_nights:
    parents: [stays_in_weekend_nights, stays_in_week_nights]
    formula: "stays_in_weekend_nights + stays_in_week_nights"
    status: deprecated

  season:
    parents: [arrival_month]
    formula: "month_to_season(arrival_month)"

  quarter:
    parents: [arrival_month]
    formula: "(arrival_month - 1) // 3 + 1"

  month_sin:
    parents: [arrival_month]
    formula: "sin(2 * pi * arrival_month / 12)"

  month_cos:
    parents: [arrival_month]
    formula: "cos(2 * pi * arrival_month / 12)"
```

